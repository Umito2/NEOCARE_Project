name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests, lint, and test APK
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 emulator checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Restore private signing key
        env:
          SIGNING_KEY: ${{ secrets.NEOCARE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SIGNING_KEY"]
          if not raw:
              raise SystemExit("Configure the private Android signing secrets first.")
          path = Path(os.environ["RUNNER_TEMP"]) / "neocare-release.p12"
          path.write_bytes(base64.b64decode(raw, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed release
        env:
          NEOCARE_KEYSTORE_PATH: ${{ runner.temp }}/neocare-release.p12
          NEOCARE_KEYSTORE_PASSWORD: ${{ secrets.NEOCARE_ANDROID_KEYSTORE_PASSWORD }}
          NEOCARE_KEY_ALIAS: ${{ secrets.NEOCARE_ANDROID_KEY_ALIAS }}
          NEOCARE_KEY_PASSWORD: ${{ secrets.NEOCARE_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/NEOCARE-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-output/NEOCARE-1.0.0.apk > release-output/signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-output/NEOCARE-1.0.0.apk > release-output/apk-info.txt
          (cd release-output && sha256sum NEOCARE-1.0.0.apk > SHA256SUMS.txt)
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neocare-android-1.0.0
          path: android/release-output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/neocare-release.p12"
